spring.application.name=job-tracker
spring.profiles.active=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_tracker}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:900000}

refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

encryption.secret=${ENCRYPTION_SECRET:}

cookie.secure=${COOKIE_SECURE:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI extraction configuration
ai.anthropic.api-url=${AI_ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}
ai.anthropic.model=${AI_ANTHROPIC_MODEL:claude-haiku-4-5}
ai.anthropic.max-tokens=${AI_ANTHROPIC_MAX_TOKENS:256}
ai.rate-limit.max-requests=${AI_RATE_LIMIT_MAX_REQUESTS:15}
